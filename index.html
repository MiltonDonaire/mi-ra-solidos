<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realidad Aumentada - Sólidos Geométricos</title>
    <!-- Librerías de recursos libres de la web -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- Escena de Realidad Aumentada -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- Marcador universal Hiro -->
        <a-marker preset="hiro">
            
            <!-- Sólido 3D: Un cubo rojo semi-transparente -->
            <!-- Puedes cambiarlo por a-sphere (esfera) o a-cylinder (cilindro) -->
            <a-box 
                position="0 0.5 0" 
                material="color: #FF1493; opacity: 0.8;"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
            </a-box>

            <!-- Líneas de contorno opcionales para resaltar la forma del sólido -->
            <a-box 
                position="0 0.5 0" 
                material="wireframe: true; color: #FFFFFF;">
            </a-box>

        </a-marker>

        <!-- Cámara requerida para renderizar la escena -->
        
        
    </a-scene>

</body>
</html>
