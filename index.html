<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realidad Aumentada - Sólidos Geométricos</title>
    <!-- 1. Cargar A-Frame desde su CDN oficial con una versión específica -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- 2. Cargar AR.js para A-Frame desde su repositorio oficial -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- Escena de Realidad Aumentada -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- Marcador universal Hiro -->
        <a-marker preset="hiro">
            
            <!-- Sólido 3D: Un cubo rojo semi-transparente -->
            <a-box 
                position="0 0.5 0" 
                material="color: #FF1493; opacity: 0.8;"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
            </a-box>

            <!-- Líneas de contorno opcionales para resaltar la forma del sólido -->
            <a-box 
                position="0 0.5 0" 
                material="wireframe: true; color: #FFFFFF;">
            </a-box>

        </a-marker>
        
        <!-- La cámara es implícita en AR.js, no necesitas declararla -->

    </a-scene>

</body>
</html>
